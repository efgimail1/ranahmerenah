services:
  db:
    image: postgres:18
    container_name: ranahmerenah_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ranahmerenah
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: ranahmerenah_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ranahmerenah
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db


    # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/ranahmerenah
    container_name: ranahmerenah_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/ranahmerenah:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend


volumes:
  pgdata: